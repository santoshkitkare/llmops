# .github/workflows/ci.yml
name: Run Unit Tests

on: 
  push:
    paths:
      - 'document_portal/**'
    branches: [ main ]
  pull_request:
    paths:
      - 'document_portal/**'
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd document_portal
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          cd document_portal
          pytest tests/
